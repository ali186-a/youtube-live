name: Google Drive to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install FFmpeg and Wget
      - name: Install FFmpeg and Wget
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget
      # 3. Download Video from Google Drive
      - name: Download Google Drive Video
        run: |
          wget --no-check-certificate \
            "https://drive.usercontent.google.com/download?id=1onpat4Q4Rvv404_aJe6wDIDr2n1x8UjJ&export=download&confirm=t" \
            -O video.mp4

      # 4. Check Video
      - name: Check Video
        run: |
          ls -lh video.mp4
          ls -lh 11.png

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            video.mp4

      # 5. Stream Vertical Video to YouTube
      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          test -n "$STREAM_KEY" || {
            echo "ERROR: YOUTUBE_STREAM_KEY is missing"
            exit 1
          }

          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -loop 1 \
            -i 11.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2[video];[video][1:v]overlay=0:0" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -pix_fmt yuv420p \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
