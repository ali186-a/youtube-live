name: Google Drive Video Live - NEW

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Wget
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      - name: Remove Old Video
        run: |
          rm -f video.mp4

      - name: Download Fresh Video
        run: |
          wget --no-check-certificate \
            --no-cache \
            "https://drive.usercontent.google.com/download?id=1DkxSXVh4MD2uyLYeHuaTBP3PHcf2x50I&export=download&confirm=t" \
            -O video.mp4

      - name: Check Video
        run: |
          ls -lh video.mp4
          file video.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            video.mp4

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          test -n "$STREAM_KEY" || {
            echo "ERROR: YOUTUBE_STREAM_KEY is missing"
            exit 1
          }

          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -pix_fmt yuv420p \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
