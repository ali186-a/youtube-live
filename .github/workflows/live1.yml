لیکن ایک اہم بات
DeepFilterNet کے Python طریقے میں PyTorch dependency بھی آ سکتی ہے، جبکہ official project خود precompiled deep-filter binary کو Python dependencies کے بغیر استعمال کرنے کا طریقہ بھی دیتا ہے۔ 

اس لیے GitHub Actions میں میں Python والا طریقہ پہلے نہیں رکھوں گا؛ زیادہ reliable طریقہ ہوگا:

Google Drive MP4 → FFmpeg سے 48kHz WAV → DeepFilterNet precompiled binary → صاف WAV → FFmpeg سے MP4 → YouTube Live loop

اور آپ کا موجودہ Start YouTube Live step تقریباً ویسا ہی رہ سکتا ہے۔

اگر آپ چاہتے ہیں تو میں آپ کے پورے YAML کو مکمل ready-to-paste version میں تبدیل کر دیتا ہوں، جس میں DeepFilterNet بھی شامل ہو اور باقی YouTube Live settings بھی برقرار رہیں۔


full code do

جی۔ میں نے official repository کی موجودہ documentation چیک کی ہے۔ ایک correction: Python package میں command deepFilter ہے، جبکہ Rust-only precompiled version میں deep-filter ہے۔ Official docs کے مطابق WAV input 48 kHz ہونا چاہیے۔ 

آپ کے لیے مکمل ready-to-paste GitHub Actions code یہ ہے:

name: YouTube Live - Single Video Loop

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ----------------------------------------
      # 1. Install FFmpeg + Python dependencies
      # ----------------------------------------
      - name: Install FFmpeg and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

          python3 -m pip install --upgrade pip
          python3 -m pip install deepfilternet


      # ----------------------------------------
      # 2. Create folders
      # ----------------------------------------
      - name: Create folders
        run: |
          mkdir -p original
          mkdir -p audio
          mkdir -p cleaned
          mkdir -p normalized


      # ----------------------------------------
      # 3. Download original video
      # ----------------------------------------
      - name: Download video
        run: |
          gdown "https://drive.google.com/uc?id=1d8mSGHHOHLcYrrX94kaOhdXG0UmNq4Qc" \
            -O "original/video.mp4"


      # ----------------------------------------
      # 4. Check original video
      # ----------------------------------------
      - name: Check original video
        run: |
          test -s "original/video.mp4"

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            "original/video.mp4"


      # ----------------------------------------
      # 5. Extract audio at 48 kHz
      # ----------------------------------------
      - name: Extract audio
        run: |
          ffmpeg -y \
            -i "original/video.mp4" \
            -vn \
            -ar 48000 \
            -ac 1 \
            -c:a pcm_s16le \
            "audio/input.wav"


      # ----------------------------------------
      # 6. Clean audio with DeepFilterNet
      # ----------------------------------------
      - name: Clean audio with DeepFilterNet
        run: |
          deepFilter \
            "audio/input.wav" \
            --output-dir "cleaned"


      # ----------------------------------------
      # 7. Find cleaned WAV
      # ----------------------------------------
      - name: Check cleaned audio
        run: |
          echo "Files generated by DeepFilterNet:"
          find cleaned -type f -maxdepth 2 -print

          CLEANED_FILE=$(find cleaned -type f -name "*.wav" | head -n 1)

          if [ -z "$CLEANED_FILE" ]; then
            echo "ERROR: Cleaned WAV not found!"
            exit 1
          fi

          echo "Cleaned audio:"
          echo "$CLEANED_FILE"

          cp "$CLEANED_FILE" "cleaned/final.wav"


      # ----------------------------------------
      # 8. Convert video + cleaned audio
      # ----------------------------------------
      - name: Convert video
        run: |
          ffmpeg -y \
            -i "original/video.mp4" \
            -i "cleaned/final.wav" \
            -map 0:v:0 \
            -map 1:a:0 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -level 4.2 \
            -b:v 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -movflags +faststart \
            "normalized/video.mp4"


      # ----------------------------------------
      # 9. Check final video
      # ----------------------------------------
      - name: Check video
        run: |
          test -s "normalized/video.mp4"

          echo "Final video:"
          ls -lh "normalized/video.mp4"

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "normalized/video.mp4"

          echo "Video OK"


      # ----------------------------------------
      # 10. Start YouTube Live
      # ----------------------------------------
      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "ERROR: STREAM_KEY secret is missing!"
            exit 1
          fi

          ffmpeg \
            -re \
            -stream_loop -1 \
            -i "normalized/video.mp4" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -flvflags no_duration_filesize \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"
⚠️ ایک ضروری بات
اوپر والا workflow Python DeepFilterNet استعمال کرتا ہے۔ Official project کے مطابق Python installation میں PyTorch dependency بھی درکار ہوتی ہے؛ اس لیے GitHub Actions میں pip install deepfilternet کے بعد dependency/compatibility issue آ سکتا ہے۔ 

زیادہ ہلکا اور بہتر طریقہ official Rust-only deep-filter binary ہے، جس میں Python/PyTorch کی ضرورت نہیں ہوتی۔ Official release اسے large files کے لیے بھی استعمال کرنے کا طریقہ بتاتی ہے۔ 

اگر آپ کا اصل مقصد GitHub Actions میں 30 منٹ تک YouTube Live چلانا ہے، تو میں آپ کے لیے اگلا version Python/PyTorch کے بغیر، صرف precompiled DeepFilterNet + FFmpeg والا بنا سکتا ہوں۔ یہ موجودہ code سے زیادہ مناسب ہوگا۔


