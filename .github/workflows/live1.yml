name: Test 2 Videos YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:

      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install -U gdown

      - name: Download 2 test videos
        run: |
          mkdir -p videos

          gdown \
            "https://drive.google.com/uc?id=1Hz3M9eNa0GfuSON06DZwbny6_oEuKuQg" \
            -O "videos/Video1.mp4"

          gdown \
            "https://drive.google.com/uc?id=1xlFs1VM-DVK3sXctVtuVDVf3ZGgGC9Sh" \
            -O "videos/Video2.mp4"

          echo "Downloaded videos:"
          ls -lh videos

      - name: Check videos
        run: |
          ffprobe -hide_banner videos/Video1.mp4
          ffprobe -hide_banner videos/Video2.mp4

      - name: Create playlist
        run: |
          cat > playlist.txt << 'EOF'
          file 'videos/Video1.mp4'
          file 'videos/Video2.mp4'
          EOF

          cat playlist.txt

      - name: Stream 2 videos continuously
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -f concat \
            -safe 0 \
            -i playlist.txt \
            -c:v libx264 \
            -preset veryfast \
            -b:v 6000k \
            -maxrate 6000k \
            -bufsize 12000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"
