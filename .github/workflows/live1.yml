name: YouTube Live - Single Video Loop

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade gdown

      - name: Download video
        run: |
          mkdir -p original normalized

          gdown "https://drive.google.com/uc?id=1jNZ9zMRvzdbQ5H3xhi0fTzockMP6T3TL" \
            -O "original/video.mp4"

      - name: Convert video
        run: |
          ffmpeg -y \
            -i "original/video.mp4" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -level 4.2 \
            -b:v 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -movflags +faststart \
            "normalized/video.mp4"

      - name: Check video
        run: |
          test -s "normalized/video.mp4"
          echo "Video OK"

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i "normalized/video.mp4" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -flvflags no_duration_filesize \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"
