
جی۔ میں نے official DeepFilterNet GitHub چیک کیا ہے۔ اس کا official repository DeepFilterNet — GitHub ہے۔ اس میں deep-filter نام کا precompiled tool بھی موجود ہے، جو WAV audio سے noise کم کر سکتا ہے؛ official documentation کے مطابق اس CLI کے لیے 48 kHz WAV استعمال ہوتا ہے۔ 

آپ کے Termux میں طریقہ
پہلے:

pkg update
pkg install git ffmpeg
پھر GitHub سے:

git clone https://github.com/Rikorose/DeepFilterNet.git
cd DeepFilterNet
لیکن یہاں فوراً Python/PyTorch وغیرہ install نہ کریں۔ آپ Android 10/Termux استعمال کر رہے ہیں، اور official Python installation میں PyTorch اور Rust-based components شامل ہیں، اس لیے کافی space اور compatibility مسئلہ آ سکتا ہے۔ 

آپ کے لیے پہلے precompiled deep-filter binary والا راستہ دیکھنا بہتر ہے۔ Official releases میں Rust-only deep-filter موجود ہے۔ 

اگر آپ چاہیں تو میں اگلا قدم آپ کے Infinix/Termux کے لیے بالکل exact commands سے دوں گا:
GitHub → ARM64 binary → install → MP4 سے audio → noise remove → واپس MP4۔


name: YouTube Live - Single Video Loop

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade gdown

      - name: Download video
        run: |
          mkdir -p original normalized

          gdown "https://drive.google.com/uc?id=1leeq1rEcWT9y42YPimDtPfvigKIBulSy" \
            -O "original/video.mp4"

      - name: Convert video
        run: |
          ffmpeg -y \
            -i "original/video.mp4" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -level 4.2 \
            -b:v 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -movflags +faststart \
            "normalized/video.mp4"

      - name: Check video
        run: |
          test -s "normalized/video.mp4"
          echo "Video OK"

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i "normalized/video.mp4" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -flvflags no_duration_filesize \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"

جی، آپ کے اسی workflow میں DeepFilterNet لگایا جا سکتا ہے۔ Official DeepFilterNet کا precompiled deep-filter Linux binary استعمال کیا جا سکتا ہے، اور یہ 48 kHz WAV کو process کرتا ہے۔ 

آپ کے موجودہ workflow میں صرف Convert video step کو اس طرح بدلیں:

      - name: Convert video and clean audio
        run: |
          mkdir -p normalized audio cleaned

          # Extract audio at 48 kHz WAV
          ffmpeg -y \
            -i "original/video.mp4" \
            -vn \
            -ar 48000 \
            -ac 1 \
            -c:a pcm_s16le \
            "audio/input.wav"

          # Install DeepFilterNet
          python3 -m pip install --upgrade deepfilternet

          # AI noise reduction
          deepFilter "audio/input.wav" \
            --output-dir "cleaned"

          # Combine original video + cleaned audio
          ffmpeg -y \
            -i "original/video.mp4" \
            -i "cleaned/input.wav" \
            -map 0:v:0 \
            -map 1:a:0 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
