name: YouTube Live Loop

on:
  workflow_dispatch:        # manual start
  schedule:
    - cron: '0 */6 * * *'   # har 6 ghante baad dobara start (job limit 6h hai)

concurrency:
  group: youtube-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Stream video.mp4 in loop
        env:
          YT_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 21000 sec = 5h50m, phir step khud band ho jata hai
          timeout 21000 ffmpeg -re -stream_loop -1 -i video.mp4 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${YT_KEY}" || true
