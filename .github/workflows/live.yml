ٹھیک ہے۔ cookies کے بغیر والا code نہیں چلے گا کیونکہ GitHub IP پر YouTube bot check لگا رہا ہے۔ اگر آپ کے پاس cookies.txt ہے تو یہ code استعمال کریں:

name: YouTube Link to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Install FFmpeg, Deno and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
          python3 -m pip install -U yt-dlp

      - name: Create YouTube Cookies
        run: |
          echo '${{ secrets.YOUTUBE_COOKIES }}' > cookies.txt
          
          if [ ! -s cookies.txt ]; then
            echo "ERROR: cookies.txt is empty"
            exit 1
          fi

      - name: Get YouTube Stream URL
        run: |
          yt-dlp \
            --cookies cookies.txt \
            --no-playlist \
            -f "best" \
            -g \
            "https://www.youtube.com/watch?v=gYSm9gakuxc" \
            > source_url.txt

          echo "YouTube source URL obtained."

      - name: Start Live Stream
        run: |
          SOURCE_URL=$(cat source_url.txt)
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"

          ffmpeg \
            -re \
            -i "$SOURCE_URL" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -pix_fmt yuv420p \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmps://a.rtmp.youtube.com/live2/$STREAM_KEY"
GitHub Secrets

اس میں دو Secrets ہوں گے:

YOUTUBE_COOKIES

اور

YOUTUBE_STREAM_KEY

YOUTUBE_COOKIES میں مکمل cookies.txt کا content جائے گا۔

اپنی stream key کو code میں دوبارہ نہ لکھیں؛ جو key آپ نے پہلے یہاں share کی تھی اسے regenerate کرنا بہتر ہے۔

اگر cookies.txt کے باوجود YouTube verification دے، تو پھر ہم cookies + browser user-agent + Android client والا زیادہ مضبوط yt-dlp configuration لگائیں گے۔

