name: YouTube Vertical Live - Loop

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      - name: Download Google Drive Video
        run: |
          wget --no-check-certificate \
          "https://drive.usercontent.google.com/download?id=1AmxYKgSraCJuWopWSWXT1SFsjNUXKOa0&export=download&confirm=t" \
          -O video.mp4

      - name: Check Files
        run: |
          echo "Checking video..."
          ls -lh video.mp4

      - name: Start YouTube Vertical Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -map 0:v \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -pix_fmt yuv420p \
            -b:v 6800k \
            -maxrate 6800k \
            -bufsize 13600k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
