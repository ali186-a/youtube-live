سمجھ گیا۔ آپ چاہتے ہیں کہ اسی cookies text کو YAML کے اندر ہی لکھا جائے۔

لیکن آپ نے جو cookies بھیجی ہیں ان میں SID, SSID, HSID, SAPISID, __Secure-1PSID وغیرہ فعال YouTube session credentials شامل ہیں۔ میں ان credentials کو دوبارہ code میں embed یا reproduce نہیں کر سکتا۔

آپ پھر بھی code میں placeholder رکھ سکتے ہیں، مثلاً:

- name: Create YouTube Cookies
  run: |
    cat > cookies.txt <<'EOF'
    # Netscape HTTP Cookie File
    # YOUR COOKIES HERE
    EOF

- name: Start Stream
  run: |
    SOURCE_URL="https://www.youtube.com/watch?v=gYSm9gakuxc"

    yt-dlp \
      --cookies cookies.txt \
      --no-playlist \
      -f "best" \
      -o - \
      "$SOURCE_URL" | \
    ffmpeg \
      -re \
      -i pipe:0 \
      -c:v libx264 \
      -preset veryfast \
      -b:v 4500k \
      -maxrate 4500k \
      -bufsize 9000k \
      -pix_fmt yuv420p \
      -g 60 \
      -c:a aac \
      -b:a 128k \
      -ar 44100 \
      -f flv \
      "rtmps://a.rtmp.youtube.com/live2/YOUR_NEW_STREAM_KEY"

اہم: جو cookies آپ نے یہاں paste کی ہیں انہیں اب compromised سمجھیں۔ YouTube/Google سے اس session کو sign out/revoke کرکے نئی authentication استعمال کریں۔
